server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;

    location = /up {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /assets/ {
        expires 7d;
    }

    location ~* ^/(styles|js)/ {
        expires 1h;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
