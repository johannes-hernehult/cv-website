server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location = /up {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /assets/ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
